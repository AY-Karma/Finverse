<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; form-action 'self'; script-src 'self' 'sha256-VnGUrM12KWVnlLgHOq0kgYbtdZe8UtOr3aQT/5Avfsw='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://cdn.jsdelivr.net https://eodhd.com; connect-src 'self' https://api.mfapi.in; object-src 'none'"
    />
    <title>Finverse</title>
    <meta name="theme-color" content="#0d0d0c" />
    <!-- Reads the saved theme before first paint so light-mode users get a light boot screen. Allowed by its hash in the CSP; edit it only with the hash. -->
    <script>try{if(JSON.parse(localStorage.getItem('finverse:settings')).mode==='light'){document.documentElement.dataset.mode='light';document.querySelector('meta[name=theme-color]').content='#e6e6e3'}}catch{}</script>
    <style>
      /* Boot screen: paints with the HTML, before the app's CSS and JS arrive. React replaces it on first render. */
      html:not([data-mode='light']) { background: #0d0d0c; color-scheme: dark; }
      html[data-mode='light'] { background: #f2f2ef; color-scheme: light; }
      body { margin: 0; }
      .boot { position: fixed; inset: 0; display: grid; font-family: system-ui, sans-serif; place-content: center; justify-items: center; gap: 20px; background: #0d0d0c; opacity: 0; animation: boot-in 300ms cubic-bezier(0.23, 1, 0.32, 1) 200ms forwards; }
      .boot svg { display: block; width: 44px; height: 44px; }
      .boot-bar { position: relative; width: 88px; height: 2px; overflow: hidden; border-radius: 2px; background: rgba(244, 244, 242, 0.12); }
      .boot-bar::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: inherit; background: #3b82f6; animation: boot-slide 1100ms cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      /* Light boot is a step dimmer than the app canvas, so a cold start does not flash full brightness. */
      html[data-mode='light'] .boot { background: #e6e6e3; }
      html[data-mode='light'] .boot-bar { background: rgba(20, 20, 16, 0.12); }
      html[data-mode='light'] .boot-bar::after { background: #2563eb; }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes boot-pulse { 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) { .boot-bar::after { width: 100%; animation: boot-pulse 1600ms ease-in-out infinite; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Finverse">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#131312"/><rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#343438" stroke-width="1.5"/><ellipse cx="32" cy="32" rx="26" ry="12.5" transform="rotate(-30 32 32)" fill="none" stroke="#828fff" stroke-width="4.5"/><path d="M21 14h26l-4 8H29v8h12l-4 8h-8v12h-8z" fill="#f4f4f2"/><path d="M9.483 45A26 12.5 -30 0 0 54.517 19" fill="none" stroke="#828fff" stroke-width="4.5"/></svg>
        <span class="boot-bar"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
